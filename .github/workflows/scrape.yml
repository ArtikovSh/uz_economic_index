name: uz-economic-index

# Runs the full pipeline on GitHub's runners (outside the local network, so
# Telegram is reachable without a proxy) and commits the Excel report back.

on:
  workflow_dispatch:            # manual "Run workflow" button
  schedule:
    - cron: '0 18 * * *'        # daily 18:00 UTC = 23:00 Tashkent (end of day)

permissions:
  contents: write               # allow the workflow to push the result back

concurrency:
  group: uz-economic-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: python main.py

      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-index
          path: output/*.xlsx
          if-no-files-found: warn
          retention-days: 90

      - name: Commit results to repo
        run: |
          git config user.name "ArtikovSh"
          git config user.email "ortikovshokhrukh@gmail.com"
          git add data/messages.csv data/daily_index.csv
          git add -f output/*.xlsx
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "data: economic index update ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
