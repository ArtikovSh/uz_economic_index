name: uz-economic-index

# Runs the full pipeline on GitHub's runners (outside the local network, so
# Telegram is reachable without a proxy) and commits the Excel report back.

on:
  workflow_dispatch:            # manual "Run workflow" button
  schedule:
    # Scrape the day 2 days ago (Tashkent). Run in the 21:00–23:00 Tashkent
    # window; two times for runner-acquisition resilience (both fetch the same
    # T-2 day, deduped in the master). Kept < 19:00 UTC so "today" stays the
    # right Tashkent date when computing the target day.
    - cron: '0 16 * * *'        # 21:00 Tashkent
    - cron: '0 18 * * *'        # 23:00 Tashkent

permissions:
  contents: write               # allow the workflow to push the result back

concurrency:
  group: uz-economic-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          # LLM classifier. RECOMMENDED: OpenAI-compatible (Groq is free) — add the
          # OPENAI_API_KEY secret; provider auto-selects "openai". Falls back to the
          # rule-based classifier if no key is set. (GitHub Models is being retired.)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: python main.py

      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-index
          path: output/*.xlsx
          if-no-files-found: warn
          retention-days: 90

      - name: Commit results to repo
        run: |
          git config user.name "ArtikovSh"
          git config user.email "ortikovshokhrukh@gmail.com"
          git add data/messages.csv data/daily_index.csv
          git add data/llm_labels.csv 2>/dev/null || true
          git add -f output/*.xlsx
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "data: economic index update ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
