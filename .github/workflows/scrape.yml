name: uz-economic-index

# Collects one full Tashkent day (2 days back) right after Tashkent midnight, so
# every post has been public >= 24h when measured; labels new posts with the LLM
# (OpenAI if OPENAI_API_KEY holds an OpenAI key, else Gemini),
# appends final days to the posts table and closed periods (day / week / month /
# quarter / year) to the indices table, and commits the results. The 02:05 run is
# a backup: it only collects channels the 00:05 run missed (posts are never
# re-measured) and continues any unfinished labelling. If anything needs a human,
# the job fails and the bot sends an alert (secrets TELEGRAM_BOT_TOKEN + BOT_ADMIN_ID).

on:
  workflow_dispatch:            # manual "Run workflow" button
    inputs:
      backfill_days:
        description: "Missed Tashkent days to collect first (YYYY-MM-DD..YYYY-MM-DD); empty = none"
        required: false
        default: '2026-09-28..2026-10-03'
  schedule:
    - cron: '5 19 * * *'        # 00:05 Tashkent
    - cron: '5 21 * * *'        # 02:05 Tashkent (backup)

permissions:
  contents: write               # allow the workflow to push the result back

concurrency:
  group: uz-economic-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # One-off: the days 2026-09-28..2026-10-03 were never collected. Scheduled runs fill
      # them too, before any later day is finalised; days already collected are skipped.
      - name: Collect missed days
        id: backfill
        if: inputs.backfill_days != '' || github.event_name == 'schedule'
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '2026-09-28..2026-10-03' }}
        run: python backfill.py "$BACKFILL_DAYS"

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # set -> OpenAI labels the posts
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}      # optional pin; empty = gpt-6-luna
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}      # optional pin; empty = auto
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}      # optional: "gemini" forces Gemini
        run: python main.py

      - name: Sync to Supabase (no-op if SUPABASE_DB_URL unset)
        id: sync
        if: always()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python sync_to_db.py

      - name: Sync to Google Sheets (no-op if secrets unset)
        id: sheets
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python sheets_sync.py

      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: economic-index
          path: output/*.xlsx
          if-no-files-found: warn
          retention-days: 90

      - name: Commit results to repo
        if: always()
        run: |
          git config user.name "ArtikovSh"
          git config user.email "ortikovshokhrukh@gmail.com"
          git add data/                          # posts table + indices table + pending
          git add -f output/economic_index_latest.xlsx || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "data: economic index update ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - name: Alert on Telegram
        if: steps.pipeline.outcome == 'failure' || steps.backfill.outcome == 'failure' || steps.sync.outcome == 'failure' || steps.sheets.outcome == 'failure'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BOT_ADMIN_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Alert skipped: TELEGRAM_BOT_TOKEN / BOT_ADMIN_ID secrets are not set."; exit 0
          fi
          DETAILS=$(head -c 1500 run_problems.txt 2>/dev/null || true)
          [ "${{ steps.backfill.outcome }}" = "failure" ] && DETAILS="$DETAILS
          Missed days could not be collected (see the log)."
          [ "${{ steps.sync.outcome }}" = "failure" ] && DETAILS="$DETAILS
          Supabase sync failed."
          [ "${{ steps.sheets.outcome }}" = "failure" ] && DETAILS="$DETAILS
          Google Sheets sync failed."
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode text="⚠️ uz-economic-index: kunlik run muammo bilan tugadi.
          ${DETAILS}
          ${RUN_URL}"

      - name: Mark the job as failed
        if: steps.pipeline.outcome == 'failure' || steps.backfill.outcome == 'failure' || steps.sync.outcome == 'failure' || steps.sheets.outcome == 'failure'
        run: exit 1
