name: llm-check

# Manual Gemini diagnostic. Run from the Actions tab, then read the log: it lists
# the models the key can call and makes one real classification call (prints the
# labels or the exact error: bad key, no free quota, model not found).

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Gemini diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python llm_check.py
