name: uz-economic-index-monthly

# Build the PREVIOUS month's index from the daily-collected data. Runs on the 3rd
# of each month — by then the daily run has collected the whole previous month
# (its last day is collected 2 days later). No scraping; re-uses the label cache.
# Manual run: Actions -> uz-economic-index-monthly -> Run workflow -> target_month.

on:
  workflow_dispatch:
    inputs:
      target_month:
        description: "Month to (re)build, YYYY-MM. Empty = previous month."
        required: false
        default: ""
  schedule:
    - cron: '0 6 3 * *'          # 3rd of each month, 06:00 UTC = 11:00 Tashkent

permissions:
  contents: write

concurrency:
  group: uz-economic-index-monthly
  cancel-in-progress: false

jobs:
  build-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Build monthly index
        id: pipeline
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TARGET_MONTH: ${{ inputs.target_month }}     # empty on the schedule
        run: python main_monthly.py

      - name: Sync to Supabase (no-op if SUPABASE_DB_URL unset)
        id: sync
        if: always()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python sync_to_db.py

      - name: Sync to Google Sheets (no-op if secrets unset)
        id: sheets
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
        run: python sheets_sync.py

      - name: Upload monthly artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: economic-index-monthly
          path: output/economic_index_monthly_latest.xlsx
          if-no-files-found: warn
          retention-days: 90

      - name: Commit monthly result
        if: always()
        run: |
          git config user.name "ArtikovSh"
          git config user.email "ortikovshokhrukh@gmail.com"
          git add data/                                # monthly_index.csv (+ any new labels)
          git add -f output/economic_index_monthly_latest.xlsx || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "data: monthly index update ($(date -u +'%Y-%m-%d') UTC)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - name: Alert on Telegram
        if: steps.pipeline.outcome == 'failure' || steps.sync.outcome == 'failure' || steps.sheets.outcome == 'failure'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BOT_ADMIN_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Alert skipped: TELEGRAM_BOT_TOKEN / BOT_ADMIN_ID secrets are not set."; exit 0
          fi
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode text="⚠️ uz-economic-index: oylik run muammo bilan tugadi.
          ${RUN_URL}"

      - name: Mark the job as failed
        if: steps.pipeline.outcome == 'failure' || steps.sync.outcome == 'failure' || steps.sheets.outcome == 'failure'
        run: exit 1
