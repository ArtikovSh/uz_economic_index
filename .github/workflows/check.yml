name: check

# Manual pre-flight check, collects no posts: Telegram session + channel handles,
# Gemini key/model, Google Sheets sync, and the bot alert (the summary is sent to
# BOT_ADMIN_ID). Shares the daily run's concurrency group so the Telegram session
# is never used from two places at once.

on:
  workflow_dispatch: {}

concurrency:
  group: uz-economic-index
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Check Telegram, Gemini, Google Sheets, bot alert
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_ADMIN_ID: ${{ secrets.BOT_ADMIN_ID }}
        run: python check.py
