name: gemini-check

# Manual diagnostic: prints the models your GEMINI_API_KEY can use and the exact
# result/error of one real classification call. Run it from the Actions tab when
# Gemini "won't run", then read the log.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Gemini diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python gemini_check.py
